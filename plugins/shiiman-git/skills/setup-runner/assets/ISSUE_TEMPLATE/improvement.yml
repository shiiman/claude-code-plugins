name: Improvement
description: Suggest an improvement to existing functionality
title: "[Improvement] "
labels: ["improvement"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: What is the current behavior?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Improvement
      description: What improvement do you suggest?
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits
      description: How will this improvement help?
    validations:
      required: false
