# Auto Labeler Configuration
# See: https://github.com/actions/labeler

# Documentation
"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "*.md"
          - "!CHANGELOG.md"
          - "plugins/**/README.md"

# CI/CD
"ci/cd":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"
