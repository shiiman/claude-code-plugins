# Auto Labeler Configuration
# See: https://github.com/actions/labeler

# Documentation
"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "*.md"
          - "!CHANGELOG.md"
          - "plugins/**/README.md"

# CI/CD
"ci/cd":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"

# Plugin labels
"plugin:shiiman-claude":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/shiiman-claude/**/*"

"plugin:shiiman-git":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/shiiman-git/**/*"

"plugin:shiiman-workflow":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/shiiman-workflow/**/*"

"plugin:shiiman-google":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/shiiman-google/**/*"

"plugin:shiiman-go":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/shiiman-go/**/*"

"plugin:shiiman-terraform":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/shiiman-terraform/**/*"

"plugin:shiiman-slack":
  - changed-files:
      - any-glob-to-any-file:
          - "plugins/shiiman-slack/**/*"
